name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 用仓库名作为 base，确保 Pages 子路径下资源可加载
      # LLM 配置从 GitHub Secrets 注入（仅演示用，勿放重要 key）
      - run: DEPLOY_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
        env:
          VITE_LLM_API_KEY: ${{ secrets.VITE_LLM_API_KEY }}
          VITE_LLM_BASE_URL: ${{ secrets.VITE_LLM_BASE_URL }}
          VITE_LLM_MODEL: ${{ secrets.VITE_LLM_MODEL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
